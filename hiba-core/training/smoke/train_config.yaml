### model
model_name_or_path: meta-llama/Llama-3.1-8B-Instruct

### method (mirrors training/train_config.yaml; only dataset/epoch/logging differ for a timing smoke test)
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target: all

### dataset
dataset: hiba_workflow_smoke
dataset_dir: ./training/smoke
template: llama3
cutoff_len: 4096
overwrite_cache: true
preprocessing_num_workers: 1

### output
output_dir: ./training/smoke/lora-out
logging_dir: ./training/smoke/logs
logging_steps: 1
save_steps: 1000
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 1
learning_rate: 0.0001
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
seed: 42
