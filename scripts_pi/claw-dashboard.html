function renderWorkflow() {
  document.getElementById('wfPlanningUrl').value   = workflowPlanningUrl;
  document.getElementById('wfAccountingUrl').value = workflowAccountingUrl;
  renderPlan();
}

async function generatePlan() {
  const task = document.getElementById('nlTaskInput').value.trim();
  if (!task) { toast('請輸入任務描述', 'var(--amber)'); return; }

  const btn = document.getElementById('generatePlanBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating…';

  try {
    const res = await safeFetch(`${workflowPlanningUrl}/api/plan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task }),
      timeout: 60_000,
    });
    if (!res.ok) { const t = await res.text(); throw new Error(`HTTP ${res.status}: ${t.slice(0,120)}`); }
    workflowPlan = await res.json();
    renderPlan();
    toast('Plan generated', 'var(--green)');
  } catch (e) {
    toast(`Plan failed: ${e.message}`, 'var(--red)');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Generate Plan';
  }
}

function renderPlan() {
  const container = document.getElementById('wfPlanContainer');
  if (!workflowPlan) {
    container.innerHTML = `<div class="empty-state" style="padding:40px 0">
      <div class="icon" style="font-size:32px;margin-bottom:8px">🧩</div>
      Enter a task above and click Generate Plan</div>`;
    return;
  }
  if (workflowPlan.error) {
    container.innerHTML = `<div class="wf-err">Plan error: ${workflowPlan.error}</div>`;
    return;
  }

  const policyOpts = ['fail-fast','partial-success']
    .map(p => `<option value="${p}"${workflowPlan.supervisorPolicy===p?' selected':''}>${p}</option>`)
    .join('');

  const stepsHtml = (workflowPlan.steps || []).map((step, i) => `
    <div class="wf-step${activeNodeId===step.nodeId?' wf-step-active-node':''}">
      <div class="wf-step-header">
        <span class="wf-step-id">${step.stepId}</span>
        <span class="wf-step-tool">${step.toolName}</span>
        ${step.dependsOn?.length ? `<span class="wf-step-dep">after ${step.dependsOn.join(', ')}</span>` : ''}
        <span style="margin-left:auto;display:flex;gap:4px">
          <button class="wf-act-btn" onclick="editStep(${i})">Edit</button>
          <button class="wf-act-btn del" onclick="removeStep(${i})">×</button>
        </span>
      </div>
      <div class="wf-step-body">
        <div class="wf-step-row">
          <span class="wf-step-lbl">Node</span><span class="wf-step-val">${step.nodeId}</span>
        </div>
        <div class="wf-step-row">
          <span class="wf-step-lbl">Version</span><span class="wf-step-val">${step.version||'—'}</span>
        </div>
        <div class="wf-step-row">
          <span class="wf-step-lbl">Input</span>
          <code class="wf-step-code">${JSON.stringify(step.input||{}, null, 2)}</code>
        </div>
      </div>
    </div>`).join('');

  container.innerHTML = `
    <div class="wf-plan-header">
      <span style="font-size:13px;color:var(--text-bright);font-weight:600">
        ${workflowPlan.steps.length} step${workflowPlan.steps.length!==1?'s':''}
      </span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:var(--muted)">Policy:</span>
        <select class="wf-select" onchange="workflowPlan.supervisorPolicy=this.value">${policyOpts}</select>
        <button class="run-btn" onclick="executePlan()">▶ Execute</button>
      </div>
    </div>
    <div class="wf-steps">${stepsHtml}</div>
    <button class="add-row-btn" style="margin-top:12px;width:100%" onclick="addStep()">+ Add Step</button>`;
}

function editStep(i) {
  const step = workflowPlan?.steps[i];
  if (!step) return;
  const raw = prompt(`Edit step ${step.stepId} — input JSON:`, JSON.stringify(step.input, null, 2));
  if (raw === null) return;
  try { step.input = JSON.parse(raw); renderPlan(); }
  catch { toast('Invalid JSON', 'var(--red)'); }
}

function removeStep(i) {
  workflowPlan?.steps.splice(i, 1);
  renderPlan();
}

function addStep() {
  if (!workflowPlan) workflowPlan = { steps: [], supervisorPolicy: 'fail-fast' };
  const id = `S${workflowPlan.steps.length + 1}`;
  workflowPlan.steps.push({
    stepId: id, toolName: 'material.protectFile',
    nodeId: activeNodeId || 'node1', version: '1.0.0',
    input: {}, dependsOn: [],
  });
  renderPlan();
}

async function executePlan() {
  if (!workflowPlan?.steps?.length) { toast('No steps to execute', 'var(--amber)'); return; }
  toast('Execute endpoint not yet connected — implement POST /api/execute on AgentServer', 'var(--amber)');
}

  selectNode(finalId);
})();
</script>
